name: 06 - Contexts
run-name: My workflow run name | Debug - ${{ inputs.debug }}

on: 
    # push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false
env:
    MY_WORKFLOW_VAR: 'workflow'
    MY_OVERWRITTEN_VAR: 'from workflow'

jobs:
    echo-data:
        runs-on: ubuntu-latest
        env:
            MY_JOB_VAR: 'job'
            MY_OVERWRITTEN_VAR: 'from job sarker'
        steps:
            - name: Display inforrmation
              run: |
                echo "Repository: ${{ github.repository }}"
                echo "Event Name: ${{ github.event_name }}"
                echo "SHA: ${{ github.sha }}"
                echo "Ref: ${{ github.ref }}"
                echo "Actor: ${{ github.actor }}"
                echo "Workflow: ${{ github.workflow }}"
                echo "Job: ${{ github.job }}"
                echo "Run ID: ${{ github.run_id }}"
                echo "Run number: ${{ github.run_number}}"

            -  name: Retrive variable
               run:  echo "Variable value:${{vars.MY_VAR}}"

            -  name: Display environment variables
               env:
                   MY_OVERWRITTEN_VAR: 'step'
               run: |
                 echo "workflow env: ${{ env.MY_WORKFLOW_VAR }}"
                 echo "MY_JOB_VAR: ${{ env.MY_JOB_VAR }}"
                 echo "MY_OVERWRITTEN_VAR: ${{ env.MY_OVERWRITTEN_VAR }}"

    echo-data2:
        runs-on: ubuntu-latest
        steps:
            - name: Print env variables
              run: |
                echo "workflow env: ${{ env.MY_WORKFLOW_VAR }}"
                echo "MY_OVERWRITTEN_VAR: ${{ env.MY_OVERWRITTEN_VAR }}"